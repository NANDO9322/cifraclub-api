services:
  app:
    build: .
    restart: on-failure
    volumes: 
      - ./app:/app
    ports: 
      - 3000:3000
    environment: 
      PYTHONPATH: /app
    depends_on:
      - "selenium"

  selenium:
    image: selenium/standalone-firefox
    shm_size: 512mb
    environment:
      SE_START_XVFB: "false"
      SE_NODE_MAX_SESSIONS: "1"
    ports:
    - 4444:4444
